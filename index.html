<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>PETclub Portal — On-Demand Pet Care Platform</title>
    <meta name="description" content="Access your PETclub account. Book grooming, training, and vet services, track active appointments live, and manage your custom pet profiles." />
    <meta name="keywords" content="pet care app, dog grooming at home, pet training, vet doctor home visit, live track groomer, professional pet services, PETclub" />
    <meta name="author" content="PETclub" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PETclub" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mypetclub.app" />
    <meta property="og:title" content="PETclub Portal — Complete On-Demand Pet Care" />
    <meta property="og:description" content="Manage appointments, view medical special health notes, and track your provider live in real time." />
    <meta property="og:image" content="https://mypetclub.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="en_IN" />
    <meta property="og:site_name" content="PETclub" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PETclub — On-Demand Dog Grooming, Training &amp; Vet Care" />
    <meta name="twitter:description" content="Book certified grooming, training, and vet care with real-time tracking and secure provider verification." />
    <meta name="twitter:image" content="https://mypetclub.app/og-image.svg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "PETclub",
      "url": "https://mypetclub.app",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web, Android, iOS",
      "description": "Global on-demand pet care platform supplying grooming, training, and vet care with live proximity tracking.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "areaServed": [
        { "@type": "AdministrativeArea", "name": "United States" },
        { "@type": "AdministrativeArea", "name": "India" }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
