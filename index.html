<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Primary Meta -->
    <title>PETclub — India's Pet Care App</title>
    <meta name="description" content="Book grooming, training, vet care and pet food delivery — all in one app. India's most trusted pet care platform." />
    <meta name="keywords" content="pet care, dog grooming, pet training, vet at home, pet food, Hyderabad, India" />
    <meta name="author" content="PETclub India" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PETclub" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.mypetclub.app" />
    <meta property="og:title" content="PETclub — India's Pet Care App" />
    <meta property="og:description" content="Book grooming, training, vet care and pet food — all in one app." />
    <meta property="og:image" content="https://app.mypetclub.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="PETclub" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PETclub — India's Pet Care App" />
    <meta name="twitter:description" content="Book grooming, training, vet care and pet food — all in one app." />
    <meta name="twitter:image" content="https://app.mypetclub.app/icon.svg" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
