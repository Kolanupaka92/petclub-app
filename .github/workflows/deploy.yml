# ══════════════════════════════════════════════════════════════════
#  PETclub Frontend — GitHub Actions CI gate + Vercel auto-deploy
#  Triggered: every push to main and every PR
#
#  Vercel auto-deploys via its GitHub App integration (already connected).
#  This workflow adds a build validation gate that must pass BEFORE Vercel
#  picks up the commit — it also runs on PRs to catch errors early.
#
#  Safeguards implemented:
#    1. VERCEL_FORCE_NO_BUILD_CACHE=1 set in Vercel project env vars
#       (done via Vercel dashboard — forces clean builds on every production
#        deploy, eliminating the cached vite binary "Permission denied" issue)
#    2. postinstall script in package.json: chmod +x node_modules/.bin/*
#       (permanent fix — repairs binary execute permissions after sharp's
#        native libvips compilation disturbs the Vercel cache layer)
#    3. smoke-test job below — runs after Vercel deploys on main pushes,
#       pings frontend + backend /api/health to confirm 200 OK
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    VITE_API_URL        — https://api.mypetclub.app/api  (build-time env)
#    VITE_MAPBOX_TOKEN   — Mapbox public token (pk.*)
# ══════════════════════════════════════════════════════════════════

name: Build & Validate Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Vite Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Install dependencies ──────────────────────────────
      #   postinstall script (package.json) runs automatically here:
      #   "chmod +x node_modules/.bin/* 2>/dev/null || true"
      #   This repairs any binary execute-permission corruption that
      #   sharp's native libvips compilation can cause in cached layers.
      - name: Install dependencies
        run: npm ci

      # ── 4. Build (Vite) ──────────────────────────────────────
      #   We inject build-time env vars from GitHub Secrets.
      #   Vercel uses the same vars configured in its project settings.
      - name: Build
        env:
          VITE_API_URL:       ${{ secrets.VITE_API_URL }}
          VITE_MAPBOX_TOKEN:  ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

      # ── 5. Report artifact size ──────────────────────────────
      - name: Report build size
        run: |
          echo "── dist/ contents ──"
          du -sh dist/
          ls -lh dist/assets/ | sort -k5 -hr | head -20

  # ── Smoke Test ─────────────────────────────────────────────────
  #   Runs only on main-branch pushes (not PRs) — Vercel only deploys
  #   to production on main. Waits for Vercel's deploy to propagate
  #   before pinging both the frontend and backend health endpoints.
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # ── 1. Checkout (needed for the smoke-test script) ────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Allow Vercel propagation ───────────────────────────
      #   Vercel's GitHub App deploys asynchronously after the commit
      #   lands. 60 s is usually enough for the build queue + CDN flush.
      - name: Wait for Vercel propagation (60s)
        run: sleep 60

      # ── 3. Run smoke tests ────────────────────────────────────
      - name: Smoke test — frontend + backend health
        env:
          FRONTEND_URL: https://app.mypetclub.app
          BACKEND_URL:  https://api.mypetclub.app
        run: |
          chmod +x scripts/smoke-test.sh
          bash scripts/smoke-test.sh
